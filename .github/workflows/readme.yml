name: Update README

on:
  push:
    branches: [ main ]
    paths:
      - README.qmd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: stable

      - name: Render README
        run: quarto render README.qmd -o README.md

      - name: Commit README if changed
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update README.md from README.qmd"
            git push
          else
            echo "No README.md changes"
          fi

